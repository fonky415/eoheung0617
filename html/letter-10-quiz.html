<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Letter 10 Quiz</title>
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: #171611;
      background: #fff;
      font-family: "SF Mono", monospace;
      line-height: 1.65;
    }
    button, a { font: inherit; }
    .quiz-page {
      width: min(100% - 32px, 860px);
      margin: 36px auto 64px;
    }
    .quiz-header {
      margin-bottom: 24px;
      text-align: center;
    }
    .eyebrow {
      margin: 0 0 8px;
      color: #777064;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.5rem, 5vw, 2rem);
    }
    .progress {
      position: sticky;
      z-index: 2;
      top: 0;
      margin: 0 -16px 20px;
      padding: 12px 16px;
      border-bottom: 1px solid #e3dfd5;
      background: rgba(255, 255, 255, 0.96);
      text-align: center;
      backdrop-filter: blur(8px);
    }
    .progress-track {
      width: min(100%, 440px);
      height: 7px;
      margin: 7px auto 0;
      overflow: hidden;
      border-radius: 999px;
      background: #eeeae2;
    }
    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: #7da77d;
      transition: width 0.2s ease;
    }
    .cards {
      display: grid;
      gap: 14px;
    }
    .quiz-card, .finish-card {
      padding: 22px;
      border: 1px solid #e3dfd5;
      border-radius: 16px;
      background: #fcfbf8;
    }
    .quiz-card.is-complete {
      border-color: #b6c8ac;
    }
    .date {
      display: block;
      margin-bottom: 10px;
      color: #777064;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
    }
    .question, .note-text {
      margin: 0;
      font-size: 1rem;
      overflow-wrap: anywhere;
    }
    .answer {
      margin: 18px 0 0;
      padding: 14px;
      border-left: 3px solid #7da77d;
      background: #f2f4ee;
      overflow-wrap: anywhere;
    }
    .answer[hidden], .self-check[hidden], .finish-card[hidden] {
      display: none;
    }
    .card-actions, .self-check {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }
    .quiz-button, .home-button {
      display: inline-block;
      padding: 9px 16px;
      border: 1px solid #bdb5a5;
      border-radius: 8px;
      background: #fff;
      color: #171611;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }
    .quiz-button:hover, .home-button:hover {
      border-color: #6d6557;
      background: #f2efe8;
    }
    .quiz-button[aria-pressed="true"] {
      border-color: #6e8d68;
      background: #e8eee3;
    }
    .quiz-button:focus-visible, .home-button:focus-visible {
      outline: 3px solid #806c99;
      outline-offset: 3px;
    }
    .finish-card {
      margin-top: 24px;
      text-align: center;
    }
    .finish-card h2 {
      font-size: clamp(1.2rem, 4vw, 1.6rem);
    }
    .finish-password {
      margin: 18px 0;
      padding: 14px;
      border: 1px solid #e3dfd5;
      border-radius: 10px;
      background: #fff;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    @media (max-width: 600px) {
      .quiz-page { margin-top: 24px; }
      .quiz-card, .finish-card { padding: 18px; }
      .quiz-button, .home-button { min-height: 44px; }
    }
  </style>
</head>
<body>

      <p>One card at a time hehe</p>
    </header>

      </div>
    </div>

    <section class="cards" id="cards" aria-label="Memory quiz cards"></section>

      <p class="finish-password" id="finishPassword"></p>

    </section>
  </main>

        const cardElement = document.getElementById(`memory-${index}`);

        cardElement.querySelectorAll('[data-choice]').forEach((button) => {

        updateProgress();

        cardElement.id = `memory-${index}`;

        date.className = 'date';
        date.textContent = item.date;
        cardElement.appendChild(date);

          const note = document.createElement('p');
          note.className = 'note-text';
          note.textContent = item.question;
          cardElement.appendChild(note);

          const nextButton = document.createElement('button');

          nextButton.className = 'quiz-button';
          nextButton.dataset.next = '';
          nextButton.textContent = 'Next';
          nextButton.addEventListener('click', () => markComplete(index, false));
          actions.appendChild(nextButton);
          cardElement.appendChild(actions);

            const observer = new IntersectionObserver((entries) => {
              if (entries.some((entry) => entry.isIntersecting)) {
                markComplete(index, false);
                observer.disconnect();
              }
            }, { threshold: 0.35 });
            observer.observe(cardElement);
          }
        } else {
          const question = document.createElement('p');
          question.className = 'question';
          question.textContent = item.question;
          cardElement.appendChild(question);

          answer.className = 'answer';
          answer.hidden = !debugMode;
          answer.textContent = item.answer || '(answer not added yet)';
          cardElement.appendChild(answer);

          revealButton.className = 'quiz-button';
          revealButton.textContent = 'Reveal answer';
          revealButton.disabled = debugMode;
          revealButton.addEventListener('click', () => {
            answer.hidden = false;
            selfCheck.hidden = false;
            revealButton.disabled = true;
          });
          actions.appendChild(revealButton);

            choiceButton.setAttribute('aria-pressed', 'false');

            selfCheck.appendChild(choiceButton);
          });
          cardElement.appendChild(selfCheck);
        }

        cardsContainer.appendChild(cardElement);
        if (debugMode) markComplete(index, item.type === 'Q');
      });

      updateProgress();

</body>
